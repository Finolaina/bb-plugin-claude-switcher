name: Bug report
description: Something does not work as the README describes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove emails, account names, paths and tokens you do not want to share.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Plugin log
      description: The relevant lines of `bb plugin logs claude-switcher`.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "bb 0.45.0, plugin 0.2.10, Claude Code 2.1.x"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
    validations:
      required: true
