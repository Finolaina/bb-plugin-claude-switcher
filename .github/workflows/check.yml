name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # dist/ must be the build of this tree (bb rebuilds it at install time;
      # the committed copy is for review).
      # The exact bb version matters: server.meta.json stamps it.
      - run: npm install -g bb-app@0.44.0
      - run: npm run build
      - run: test -z "$(git status --porcelain -- dist)"
